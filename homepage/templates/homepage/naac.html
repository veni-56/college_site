<!DOCTYPE html>
<html>
<head>
  <title>NAAC</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f8f9fa;
    }
    .naac-heading {
      font-size: 32px;
      font-weight: bold;
      margin-top: 40px;
      margin-bottom: 30px;
      color: #003399;
      text-align: center;
    }
    .button-grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
    }
    .naac-button {
      width: 220px;
      height: 100px;
      font-size: 18px;
      font-weight: 500;
      background-color: #003399;
      color: white;
      border: none;
      border-radius: 10px;
      text-align: center;
      padding: 20px;
      text-decoration: none;
      transition: background-color 0.3s;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .naac-button:hover {
      background-color: #002266;
      text-decoration: none;
      color: white;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="naac-heading">NAAC</div>

    <div class="button-grid">
      {% for item in naac_submenus %}
        <a class="naac-button" href="{{ item.pdf.url }}" target="_blank">{{ item.name }}</a>
      {% empty %}
        <p>No documents available.</p>
      {% endfor %}
    </div>
  </div>

</body>
</html>
